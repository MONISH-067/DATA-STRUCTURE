        M 126 100
        H 164
        A 52 52 0 0 1 216 152
        V 172
        A 52 52 0 0 1 164 224
        H 112
        V 114
        Z
      "/>
    </mask>
  
  </defs>
  <g id="symbol" transform="translate(16, 0)">
    
  <g id="symbol">
